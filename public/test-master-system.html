<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Master System GLB Comparison</title>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>
body { font-family: system-ui, sans-serif; margin: 2rem; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
h2 { margin-top: 0; }
</style>
</head>
<body>
<h1>Sega Master System GLB Comparison</h1>
<div class="grid">
<div>
<h2>Working tree – current modified</h2>
<model-viewer src="/models/consoles/master-system.glb" camera-controls auto-rotate exposure="1" style="width:100%;height:400px;background:#111"></model-viewer>
<p>Current working tree file. DiffuseFactor set to pure white.</p>
</div>
<div>
<h2>HEAD – original</h2>
<model-viewer src="/models/consoles/master-system-head.glb" camera-controls auto-rotate exposure="1" style="width:100%;height:400px;background:#111"></model-viewer>
<p>HEAD version copied from git. Original material tinting preserved.</p>
</div>
</div>
</body>
</html>
